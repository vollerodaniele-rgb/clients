<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Box</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
</head>
<body>

  <header class="hero">
    <p class="hero-kicker" id="kicker">&nbsp;</p>
    <h1 class="hero-title" id="box-title">Idea Box</h1>
    <p class="hero-sub" id="intro"></p>
  </header>

  <main>
    <section class="section">
      <form id="idea-form" class="idea-form" hidden>
        <label class="field">
          <span>Your idea</span>
          <textarea id="idea-text" rows="4" maxlength="1000" required
            placeholder="A street at 4am. An old jacket. A sound you can’t get out of your head. Start anywhere."></textarea>
        </label>
        <div class="pic-field" id="voice-field" hidden>
          <span class="pic-label">Voice message (optional)</span>
          <div class="pic-row">
            <button type="button" class="btn-file" id="rec-start">Record a voice message</button>
            <button type="button" class="btn-file recording" id="rec-stop" hidden>
              <span class="rec-dot"></span> Stop recording
            </button>
            <span class="pic-name muted" id="rec-status">Nothing recorded</span>
            <button type="button" class="btn-clear" id="rec-clear" hidden>Remove recording</button>
          </div>
          <audio id="rec-preview" class="rec-preview" controls hidden></audio>
        </div>

        <div class="pic-field">
          <span class="pic-label">Picture (optional)</span>
          <div class="pic-row">
            <label class="btn-file">
              Choose a picture
              <input id="idea-image" type="file" accept="image/*">
            </label>
            <span class="pic-name muted" id="pic-name">No picture chosen</span>
            <button type="button" class="btn-clear" id="pic-clear" hidden>Remove picture</button>
          </div>
          <img id="pic-preview" class="pic-preview" alt="" hidden>
        </div>

        <div class="form-row">
          <label class="field">
            <span>Name or alias (optional)</span>
            <input id="idea-name" type="text" maxlength="60" placeholder="How should we credit you?">
          </label>
          <button type="submit" class="btn-send" id="idea-submit">Send it</button>
        </div>
        <input type="text" id="idea-website" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>

      <h2 class="wall-title" id="wall-title">The Wall</h2>
      <div class="idea-grid" id="idea-grid">
        <p class="muted" id="idea-status">Loading ideas...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p id="foot">NOIR AU NOIR</p>
    <p class="muted">Every idea lands with the team. Nothing gets lost.</p>
  </footer>

  <script src="../../assets/box.js"></script>
</body>
</html>
