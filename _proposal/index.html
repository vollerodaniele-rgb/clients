<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/proposal.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand" id="brand">NOIR AU NOIR</div>
    <div class="rule"></div>
    <div class="client-title" id="client-title">&nbsp;</div>
    <div class="client-sub" id="client-sub"></div>
    <div class="for-line" id="for-line"></div>
  </header>

  <p class="intro" id="intro">
    <span class="lead" id="intro-lead"></span>
    <span id="intro-text"></span>
  </p>

  <div id="packages"></div>

  <div id="notes"></div>

  <section id="process-section">
    <div class="sec-head">
      <div class="num" id="process-num"></div>
      <h2 id="process-title"></h2>
    </div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="terms" id="terms-section">
    <div class="sec-head" style="padding-top:0">
      <div class="num">Terms</div>
      <h2>The Agreement</h2>
    </div>
    <div class="terms-grid" id="terms-grid"></div>
  </section>

  <footer class="end">
    <div class="foot-brand" id="foot-brand">NOIR AU NOIR</div>
    <div class="foot-line"></div>
    <div class="foot-meta" id="foot-meta"></div>
  </footer>

</div>
<script src="../../assets/proposal-page.js"></script>
</body>
</html>
