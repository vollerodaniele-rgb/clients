<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir au Noir | Video production in Belgium</title>
  <!-- Since September 2026 this is the studio's official page:
       noiraunoir.com redirects here. So unlike everything else on this
       site it is meant to be found, and the canonical address folds the
       personal links (#id, #move-...) into this one. -->
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://clients.noiraunoir.com/call/">

  <!-- How this looks when somebody forwards it. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Noir au Noir">
  <meta property="og:title" content="Noir au Noir, video production in Belgium">
  <meta property="og:description" content="A video production studio for restaurants, fashion and brands. Book twenty minutes, no pitch, and we ring you.">
  <meta property="og:url" content="https://clients.noiraunoir.com/call/">
  <meta property="og:image" content="https://clients.noiraunoir.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Noir au Noir, monthly video for restaurants in Belgium">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Noir au Noir is a video production studio in Belgium, filming for restaurants, fashion and brands. Book a twenty minute call, no pitch.">
  <link rel="stylesheet" href="../assets/styles.css?v=2026-09-17c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

  <main class="transfer-wrap">
    <p class="transfer-kicker">NOIR AU NOIR</p>
    <h1 class="transfer-title" id="title">Book a call</h1>
    <!-- who we are, for someone arriving from noiraunoir.com. Hidden on a
         personal link, where the person already knows. -->
    <p class="transfer-note" id="studio-line">Noir au Noir is a video production studio in Belgium. We film for restaurants, fashion and brands, and every client gets their own page with the plan, the films and the numbers.</p>
    <p class="transfer-note" id="intro">Loading the times...</p>

    <!-- a few named times land in #slots. A window of opening hours
         draws a month in #cal instead, and the chosen day's hours in
         #hours. Only one of the two is ever filled. -->
    <div id="slots" class="pick-grid" style="margin-top:2.5rem"></div>

    <div id="cal-wrap" hidden style="margin-top:2.5rem">
      <div class="cal-top">
        <button type="button" class="btn-month" id="cal-back" aria-label="Previous month">&#8592;</button>
        <span class="cal-month" id="cal-month"></span>
        <button type="button" class="btn-month" id="cal-next" aria-label="Next month">&#8594;</button>
      </div>
      <div class="cal" id="cal"></div>
      <div id="hours" class="hour-grid" hidden></div>
    </div>

    <div id="details" hidden style="margin-top:2rem">
      <p class="pick-lede" id="chosen"></p>
      <label class="field"><span>Your name</span>
        <input id="who" type="text" maxlength="60" placeholder="Who am I speaking to?">
      </label>
      <label class="field" style="margin-top:0.8rem"><span>Your email</span>
        <input id="mail" type="email" maxlength="120" placeholder="So I can confirm it">
      </label>
      <label class="field" style="margin-top:0.8rem"><span>Your phone</span>
        <input id="phone" type="tel" maxlength="30" placeholder="The number I should call">
      </label>
      <label class="field" style="margin-top:0.8rem"><span>Anything I should know (optional)</span>
        <input id="about" type="text" maxlength="200" placeholder="Your place, what you are after">
      </label>
      <input type="text" id="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div style="margin-top:1.2rem">
        <button class="btn-send" id="book">Book it</button>
      </div>
      <p class="form-msg" id="msg" role="status" style="margin-top:0.8rem"></p>
    </div>
  </main>

  <footer class="footer">
    <p>NOIR AU NOIR</p>
    <p class="muted">Video production &middot; Gent, Belgium &middot; <a href="mailto:info@noiraunoir.com">info@noiraunoir.com</a></p>
  </footer>

  <script src="../assets/call.js?v=2026-09-17"></script>
</body>
</html>
