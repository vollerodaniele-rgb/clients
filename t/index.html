<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- How this looks when somebody forwards it. noindex above keeps it
       out of search; these let the preview be built, which robots.txt
       used to prevent by refusing the crawler the page entirely. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Noir au Noir">
  <meta property="og:title" content="Files from Noir au Noir">
  <meta property="og:description" content="There are files waiting behind this link. It does not expire in a week.">
  <meta property="og:url" content="https://noiraunoir.com/t/">
  <meta property="og:image" content="https://noiraunoir.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Noir au Noir, monthly video for restaurants in Belgium">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="There are files waiting behind this link. It does not expire in a week.">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>

  <main class="transfer-wrap">
    <p class="transfer-kicker">NOIR AU NOIR</p>
    <h1 class="transfer-title" id="title">&nbsp;</h1>
    <p class="transfer-note" id="note"></p>

    <div id="files" class="transfer-files">
      <p class="muted">Loading...</p>
    </div>

    <p class="transfer-expiry" id="expiry"></p>
  </main>

  <footer class="footer">
    <p>NOIR AU NOIR</p>
    <p class="muted">Sent you these? Reply to the message they came in.</p>
  </footer>

  <script src="../assets/transfer.js"></script>

</html>
