<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Noir au Noir</title>
<!-- A draft of the official site. Not linked from anywhere and kept out
     of search until he decides it replaces /call/. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127916;</text></svg>">
<style>
  @font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }

  :root {
    --bg: #000;
    --ink: #F2F2F2;
    --dim: rgba(242, 242, 242, 0.66);
    --quiet: rgba(242, 242, 242, 0.45);
    --glass: rgba(20, 20, 24, 0.52);
    --edge: rgba(255, 255, 255, 0.14);
    --lip: rgba(255, 255, 255, 0.22);
    --blur: blur(26px) saturate(170%);
    --font: "Satoshi", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }

  /* the two soft lights every page of the studio has behind it */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(60rem 40rem at 88% -10%, rgba(255, 255, 255, 0.08), transparent 62%),
      radial-gradient(50rem 36rem at -8% 110%, rgba(255, 255, 255, 0.06), transparent 62%);
  }

  /* ============ THE NAME ============ */
  .name {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + clamp(1.2rem, 4vh, 2.4rem));
    font-size: clamp(0.72rem, 1.4vw, 0.9rem); font-weight: 700; letter-spacing: 0.6em;
    padding-left: 0.6em; /* letter spacing hangs off the end, this rebalances it */
    white-space: nowrap; pointer-events: none;
  }
  .sub {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + clamp(2.6rem, 7.4vh, 4.3rem));
    font-size: 0.72rem; letter-spacing: 0.08em; color: var(--quiet); white-space: nowrap; pointer-events: none;
  }

  /* ============ THE MAP ============ */
  /* The whole screen on a computer. On a phone the world keeps its height
     and runs wider than the screen, so you travel it sideways. */
  .stage {
    position: relative; z-index: 1; height: 100%; width: 100%;
    display: grid; place-items: center;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .stage::-webkit-scrollbar { display: none; }

  .world {
    position: relative;
    aspect-ratio: 2400 / 1100;
    width: min(100vw, calc(100svh * 2400 / 1100));
  }
  @media (max-aspect-ratio: 1 / 1) {
    /* normal, not centred: newer browsers also centre a block that is
       wider than its scroller, which pushes half the world off to the
       left where no swipe can reach it */
    .stage { display: block; place-items: normal; justify-items: normal; }
    .world { width: auto; height: 100%; }
  }

  .world svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .land { fill: rgba(255, 255, 255, 0.025); stroke: rgba(242, 242, 242, 0.62); stroke-width: 0.9; vector-effect: non-scaling-stroke; }
  .borders { fill: none; stroke: rgba(242, 242, 242, 0.16); stroke-width: 0.6; vector-effect: non-scaling-stroke; }

  /* ============ THE PLACES ============ */
  .pin {
    position: absolute; z-index: 2; width: 0; height: 0;
    /* its left and top are the place itself; everything hangs from that */
  }
  .spot {
    position: absolute; z-index: 2; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 4px rgba(242, 242, 242, 0.12); pointer-events: none;
  }
  .pin .stem { position: absolute; left: -0.5px; bottom: 3px; width: 1px; height: 26px; background: rgba(242, 242, 242, 0.5); }

  .thumb {
    position: absolute; left: 50%; bottom: 29px; transform: translateX(-50%);
    width: 54px; height: 54px; border-radius: 50%; overflow: hidden; padding: 0;
    border: 1px solid var(--edge); border-top-color: var(--lip);
    background: var(--glass); cursor: pointer;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.9);
    transition: width 0.35s cubic-bezier(.2,.8,.2,1), height 0.35s cubic-bezier(.2,.8,.2,1), border-radius 0.35s;
  }
  .thumb video, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .thumb:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .pin .label {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
    font-size: 0.68rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    white-space: nowrap; color: var(--ink); opacity: 0; transition: opacity 0.25s; pointer-events: none;
    text-shadow: 0 1px 8px #000;
  }
  .pin.count .thumb::after {
    content: attr(data-count); position: absolute; right: 2px; top: 2px;
    min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
    font: 700 0.6rem/18px var(--font); color: #000; background: var(--ink);
  }

  /* on a screen with a mouse, pointing at a place opens it up in place */
  @media (hover: hover) {
    .pin:hover { z-index: 4; }
    .pin:hover .thumb { width: 190px; height: 130px; border-radius: 16px; }
    .pin:hover .thumb.tall { width: 110px; height: 190px; }
    .pin:hover .label { opacity: 1; bottom: calc(29px + 190px + 10px); }
  }

  @media (max-width: 40rem) {
    .thumb { width: 46px; height: 46px; }
  }

  /* ============ ONE PLACE, OPENED ============ */
  .veil { position: fixed; inset: 0; z-index: 8; background: rgba(0, 0, 0, 0.45); }
  .card {
    position: fixed; z-index: 9; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(92vw, 480px); max-height: 88svh; overflow: auto;
    border: 1px solid var(--edge); border-top-color: var(--lip); border-radius: 22px;
    background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    padding: 14px 14px 20px;
  }
  /* a phone gets it as a sheet from the bottom, where the thumb is */
  @media (max-width: 40rem) {
    .card { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; border-radius: 22px 22px 0 0;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  }
  .places { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 52px 12px 2px; }
  .places button {
    padding: 0.45rem 0.85rem; border-radius: 999px; cursor: pointer;
    font: 500 0.72rem var(--font); letter-spacing: 0.04em; color: var(--dim);
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--edge);
  }
  .places button.on { color: #000; background: var(--ink); border-color: var(--ink); }
  .screen { position: relative; border-radius: 14px; overflow: hidden; background: #0b0b0d; }
  .screen video, .screen img { width: 100%; max-height: 58svh; object-fit: contain; display: block; background: #000; }
  .sound {
    position: absolute; right: 10px; bottom: 10px; padding: 0.45rem 0.8rem; border-radius: 999px; cursor: pointer;
    font: 700 0.6rem var(--font); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink); background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .sound.on { background: var(--ink); color: #000; }
  .strip { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .strip button {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 10px; overflow: hidden; padding: 0; cursor: pointer;
    border: 1px solid var(--edge); background: #0b0b0d; opacity: 0.55;
  }
  .strip button.on { opacity: 1; border-color: var(--ink); }
  .strip video, .strip img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .where { margin-top: 16px; padding-inline: 4px; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--quiet); }
  .title { margin-top: 6px; padding-inline: 4px; font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
  .what { margin-top: 8px; padding-inline: 4px; font-size: 0.95rem; line-height: 1.6; color: var(--dim); max-width: 60ch; }
  .tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--edge);
    font-size: 0.58rem; letter-spacing: 0.14em; vertical-align: middle; color: var(--quiet); }
  .close {
    position: absolute; right: 22px; top: 22px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    color: var(--ink); background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); font: 400 1.1rem/1 var(--font);
  }

  /* ============ THE WAY IN ============ */
  .foot {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(1rem, 3.5vh, 2rem));
    display: flex; gap: 0.6rem; align-items: center; white-space: nowrap;
  }
  .book {
    padding: 0.8rem 1.4rem; border-radius: 999px; text-decoration: none;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #000; background: var(--ink);
  }
  .hint { font-size: 0.72rem; color: var(--quiet); transition: opacity 0.6s; }
  @media (min-width: 40rem) { .hint { display: none; } }

  @media (prefers-reduced-motion: reduce) { .thumb, .label, .hint { transition: none; } }
</style>
</head>

4L1357,399.1L1359.1,395.4M1433.9,596.3L1429.8,587.9L1426.8,586.1L1425.6,583.1L1422.1,579.3L1418,578.8L1420.2,574.4L1423.7,574.2L1424.6,571.9M1479,542.2L1476.8,545.6L1474.7,549.2L1475.3,551.3L1475.5,553.7L1479.2,553.8L1480.7,553.3L1482.3,554.6L1480.9,557.4L1483.5,561.6L1486.1,565.3L1488.7,568L1510.6,577.2L1516.2,577.1M1484.5,550.5L1482.3,554.6M1401.8,647.3L1397.9,649.6L1396.3,648.8M1404.5,611.6L1407.2,609.5L1411.4,611.2L1416.7,609.4L1421.4,609.5L1425.4,605.9M1313.7,293.3L1315.8,293.3L1314.6,296.6L1317.7,299.6L1317.1,303.1L1315.7,303.5L1314.6,304.2L1312.8,305.9L1312.2,310.1M1325,316.2L1325.7,316.3L1325.9,314.7L1329.4,313.5L1330.7,313.2L1332.8,312.8L1335.5,312.7M1330.7,313.2L1330.5,312.7L1331.1,311.7L1331.7,309.9L1330.8,309.9L1329.5,308.5L1328.5,308.2L1327.6,306.9L1326.4,306.5L1325.5,305.4L1324.4,305.8L1323.8,308.3L1322.4,308.9L1322.8,308.2L1320.4,306.7L1318.4,305.8L1317.4,304.8L1315.7,303.5M1322.4,308.9L1321.4,310.6"/>
      </svg>
      <!-- the places are drawn here from PLACES below -->
    </div>
  </main>

  <div class="foot">
    <a class="book" href="../call/">Book a call</a>
    <span class="hint" id="hint">Swipe to travel</span>
  </div>

  <div class="veil" id="veil" hidden></div>
  <section class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title" hidden>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
    <!-- when one pin holds several places -->
    <div class="places" id="places" hidden></div>
    <div class="screen" id="screen"></div>
    <div class="strip" id="strip"></div>
    <p class="where" id="card-where"></p>
    <h2 class="title" id="card-title"></h2>
    <p class="what" id="card-what"></p>
  </section>

<script>
/* ============ EVERY PLACE WE FILMED ============ */
/* One entry per place. Several pieces at one place share one pin. A piece
   is a film or a photo: `src` is the file, `tall` for anything upright so
   the pin opens the right shape. `example: true` marks the ones that are
   only here to show the idea, until the real places replace them. */
const RELAY = "https://kresha-idea-box.vollerodaniele.workers.dev";

const PLACES = [
  {
    place: "Gent", country: "Belgium", lat: 51.0543, lon: 3.7174,
    title: "Sakas",
    what: "Monthly reels for a restaurant in Gent: the ageing fridges, the knives, the kitchen at work. One of them reached 112,000 people.",
    pieces: [
      { kind: "film", src: "../reels/examples/1.mp4", tall: true },
      { kind: "film", src: "../reels/examples/4.mp4" },
      { kind: "photo", src: RELAY + "/thumb?client=sakas&post=7O5cNYv_" },
      { kind: "film", src: "../reels/examples/2.mp4", tall: true }
    ]
  },
  {
    place: "Antwerp", country: "Belgium", lat: 51.2194, lon: 4.4025, example: true,
    title: "A tailor's atelier",
    what: "Example pin, to show the idea. A real shoot goes here: where, for whom, and what was made.",
    pieces: [{ kind: "film", src: "../reels/examples/3.mp4" }]
  },
  {
    place: "Paris", country: "France", lat: 48.8566, lon: 2.3522, example: true,
    title: "A showroom during fashion week",
    what: "Example pin, to show the idea.",
    pieces: [{ kind: "film", src: "../reels/examples/5.mp4", tall: true }]
  },
  {
    place: "Milan", country: "Italy", lat: 45.4642, lon: 9.19, example: true,
    title: "A perfume launch",
    what: "Example pin, to show the idea.",
    pieces: [{ kind: "photo", src: RELAY + "/thumb?client=sakas&post=dmmvHpWz" }]
  },
  {
    place: "Mitrovica", country: "Kosovo", lat: 42.8914, lon: 20.8660, example: true,
    title: "A music film",
    what: "Example pin, to show the idea.",
    pieces: [{ kind: "film", src: "../reels/examples/4.mp4" }]
  }
];

/* ============ WHERE ON THE MAP ============ */
/* The same projection the outline was drawn with (Natural Earth, fitted
   to 2400 by 1100 at build time), so a place lands on its own coast. */
const MAP = { W: 2400, H: 1100, scale: 436.631, tx: 1200, ty: 638.55 };

function project(lon, lat) {
  const l = lon * Math.PI / 180, p = lat * Math.PI / 180;
  const p2 = p * p, p4 = p2 * p2;
  const x = l * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));
  const y = p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)));
  return [MAP.tx + MAP.scale * x, MAP.ty - MAP.scale * y];
}

const $ = (id) => document.getElementById(id);

function media(piece, attrs) {
  if (piece.kind === "photo") {
    const img = document.createElement("img");
    img.src = piece.src;
    img.alt = "";
    img.loading = "lazy";
    return img;
  }
  const v = document.createElement("video");
  v.src = piece.src;
  v.muted = true;
  v.loop = true;
  v.playsInline = true;
  v.preload = attrs && attrs.preload || "metadata";
  return v;
}

/* ============ THE PINS ============ */
/* A studio in Belgium films mostly in Belgium, and on a map of the whole
   world Gent and Antwerp are a few pixels apart. So places closer than a
   thumbnail on screen share one pin with a number on it, and opening it
   lets you choose the place. Every place keeps its own dot, so the map
   still shows exactly where. Worked out again when the screen changes
   size, since a phone spreads the world wider than a computer does. */
const world = $("world");
let groups = [];

function drawPins() {
  for (const old of world.querySelectorAll(".pin, .spot")) old.remove();

  const width = world.offsetWidth;
  const height = world.offsetHeight;
  const reach = innerWidth < 640 ? 58 : 66;
  const at = PLACES.map((pl) => {
    const [x, y] = project(pl.lon, pl.lat);
    return { x: x / MAP.W * width, y: y / MAP.H * height };
  });

  groups = [];
  PLACES.forEach((pl, i) => {
    const near = groups.find((g) => Math.hypot(at[g.members[0]].x - at[i].x, at[g.members[0]].y - at[i].y) < reach);
    if (near) near.members.push(i);
    else groups.push({ members: [i] });
  });

  // one dot per place, whatever its group
  PLACES.forEach((pl, i) => {
    const spot = document.createElement("span");
    spot.className = "spot";
    spot.style.left = at[i].x + "px";
    spot.style.top = at[i].y + "px";
    world.appendChild(spot);
  });

  groups.forEach((g, gi) => {
    const lead = PLACES[g.members[0]];
    const pin = document.createElement("div");
    const pieces = g.members.reduce((n, i) => n + PLACES[i].pieces.length, 0);
    pin.className = "pin" + (g.members.length > 1 || pieces > 1 ? " count" : "");
    pin.style.left = at[g.members[0]].x + "px";
    pin.style.top = at[g.members[0]].y + "px";

    const first = lead.pieces[0];
    const thumb = document.createElement("button");
    thumb.type = "button";
    thumb.className = "thumb" + (first.tall ? " tall" : "");
    // a group counts its places, a single place counts its pieces
    thumb.dataset.count = g.members.length > 1 ? g.members.length : pieces;
    const names = g.members.map((i) => PLACES[i].place);
    thumb.setAttribute("aria-label", names.length > 1 ? names.length + " places: " + names.join(", ") : lead.place + ": " + lead.title);
    const m = media(first);
    thumb.appendChild(m);

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = names.length > 2 ? names.slice(0, 2).join(", ") + " +" + (names.length - 2) : names.join(", ");

    pin.append(label, thumb, Object.assign(document.createElement("span"), { className: "stem" }));

    // pointing at it plays it; the film stops again when the pointer leaves
    if (m.tagName === "VIDEO") {
      pin.addEventListener("mouseenter", () => { m.play().catch(() => {}); });
      pin.addEventListener("mouseleave", () => { m.pause(); });
    }
    thumb.addEventListener("click", () => open(gi));
    world.appendChild(pin);
  });
}

/* ============ ONE PLACE, OPENED ============ */
let current = null;

function show(pl, index) {
  const screen = $("screen");
  screen.innerHTML = "";
  const piece = pl.pieces[index];
  const m = media(piece, { preload: "auto" });
  screen.appendChild(m);

  if (m.tagName === "VIDEO") {
    m.play().catch(() => {});
    // it starts silent, because a browser will not start it any other way
    const sound = document.createElement("button");
    sound.type = "button";
    sound.className = "sound";
    sound.textContent = "Sound";
    sound.addEventListener("click", () => {
      m.muted = !m.muted;
      sound.classList.toggle("on", !m.muted);
      sound.textContent = m.muted ? "Sound" : "Sound on";
      if (m.paused) m.play().catch(() => {});
    });
    screen.appendChild(sound);
  }

  [...$("strip").children].forEach((b, i) => b.classList.toggle("on", i === index));
}

function place(pl) {
  current = pl;
  $("card-where").textContent = pl.place + ", " + pl.country;
  $("card-title").innerHTML = "";
  $("card-title").append(pl.title);
  if (pl.example) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "EXAMPLE";
    $("card-title").appendChild(tag);
  }
  $("card-what").textContent = pl.what;

  const strip = $("strip");
  strip.innerHTML = "";
  strip.hidden = pl.pieces.length < 2;
  pl.pieces.forEach((p, n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Piece " + (n + 1));
    b.appendChild(media(p));
    b.addEventListener("click", () => show(pl, n));
    strip.appendChild(b);
  });

  show(pl, 0);
  [...$("places").children].forEach((c) => c.classList.toggle("on", c.dataset.place === pl.place));
}

function open(gi) {
  const g = groups[gi];
  const chips = $("places");
  chips.innerHTML = "";
  chips.hidden = g.members.length < 2;
  g.members.forEach((i) => {
    const c = document.createElement("button");
    c.type = "button";
    c.dataset.place = PLACES[i].place;
    c.textContent = PLACES[i].place;
    c.addEventListener("click", () => place(PLACES[i]));
    chips.appendChild(c);
  });

  place(PLACES[g.members[0]]);
  $("veil").hidden = false;
  $("card").hidden = false;
  $("close").focus();
  for (const v of world.querySelectorAll("video")) v.pause();
}

function close() {
  $("card").hidden = true;
  $("veil").hidden = true;
  $("screen").innerHTML = "";
  current = null;
}

$("close").addEventListener("click", close);
$("veil").addEventListener("click", close);
addEventListener("keydown", (e) => { if (e.key === "Escape" && current) close(); });

/* ============ WHERE THE PHONE STARTS ============ */
/* On a phone the world is wider than the screen, so it opens on home:
   Belgium in the middle, the rest of the world a swipe away. */
const stage = $("stage");
function startAtHome() {
  if (stage.scrollWidth <= stage.clientWidth) return;
  const [x] = project(4.4, 50.8);
  stage.scrollLeft = world.offsetWidth * (x / MAP.W) - stage.clientWidth / 2;
}
drawPins();
startAtHome();
let settle;
addEventListener("resize", () => { clearTimeout(settle); settle = setTimeout(() => { drawPins(); startAtHome(); }, 150); });

stage.addEventListener("scroll", () => { $("hint").style.opacity = "0"; }, { once: true, passive: true });
</script>
